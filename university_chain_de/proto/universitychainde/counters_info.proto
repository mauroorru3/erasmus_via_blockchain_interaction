syntax = "proto3";
package university_chain_de.universitychainde;

option go_package = "university_chain_de/x/universitychainde/types";

message CountersInfo {
    repeated int32 PacketsRetriesStartErasmus = 1; 
    int32 AcksReceivedStartErasmus = 2;
    int32 retryNumberOperations = 3;
    int32 maximumNumberRetries = 4;
    int32 errorAcksOrTimeoutsReceived = 5;
    bool revertErasmusCareerCompleted = 6;
}
