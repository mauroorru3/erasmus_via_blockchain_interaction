syntax = "proto3";
package university_chain_it.universitychainit;

option go_package = "university_chain_it/x/universitychainit/types";

message CountersInfo {
    repeated int32 PacketsRetriesStartErasmus = 1; 
    int32 AcksReceivedStartErasmus = 2;
    int32 retryNumberOperations = 3;
    int32 maximumNumberRetries = 4;
}
